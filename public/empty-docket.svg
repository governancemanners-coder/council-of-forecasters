<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" fill="none" role="img" aria-label="Empty docket with gavel">
  <!-- Minimal line illustration: empty clipboard / docket + gavel resting beside -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- clipboard board -->
    <rect x="150" y="70" width="260" height="320" rx="14" fill="#FFFFFF" stroke="#3F444A" stroke-width="3"/>
    <!-- clip -->
    <rect x="238" y="52" width="84" height="36" rx="12" fill="#F2F0EA" stroke="#3F444A" stroke-width="3"/>
    <circle cx="280" cy="70" r="5" fill="#FAF9F6" stroke="#3F444A" stroke-width="2.5"/>
    <!-- empty docket lines (faint, warm gray) -->
    <g stroke="#D4D2CB" stroke-width="3">
      <line x1="182" y1="140" x2="378" y2="140"/>
      <line x1="182" y1="176" x2="378" y2="176"/>
      <line x1="182" y1="212" x2="330" y2="212"/>
      <line x1="182" y1="248" x2="378" y2="248"/>
      <line x1="182" y1="284" x2="300" y2="284"/>
    </g>
    <!-- the single teal accent line: the docket headline, waiting -->
    <line x1="182" y1="112" x2="330" y2="112" stroke="#0F766E" stroke-width="5"/>
    <!-- faint checkboxes -->
    <g stroke="#D4D2CB" stroke-width="2.5">
      <rect x="182" y="322" width="16" height="16" rx="4"/>
      <rect x="182" y="352" width="16" height="16" rx="4"/>
    </g>
    <g stroke="#E7E5DE" stroke-width="3">
      <line x1="210" y1="330" x2="300" y2="330"/>
      <line x1="210" y1="360" x2="268" y2="360"/>
    </g>
    <!-- gavel resting beside the docket -->
    <g transform="rotate(28 470 320)">
      <rect x="428" y="236" width="88" height="42" rx="14" fill="#F2F0EA" stroke="#3F444A" stroke-width="3"/>
      <rect x="462" y="276" width="18" height="118" rx="9" fill="#FFFFFF" stroke="#3F444A" stroke-width="3"/>
    </g>
    <!-- sound-block under gavel -->
    <rect x="430" y="404" width="120" height="14" rx="7" fill="#F2F0EA" stroke="#3F444A" stroke-width="2.5"/>
  </g>
</svg>
