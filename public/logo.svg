<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Council of Forecasters mark">
  <!-- Twelve seats in a ring; the 2 o'clock seat in Council Teal -->
  <g>
    <!-- i=0 is 12 o'clock; 2 o'clock = index 2 -->
    <circle cx="32" cy="8.5"  r="4.2" fill="#6B7280"/>
    <circle cx="43.75" cy="11.79" r="4.2" fill="#6B7280"/>
    <circle cx="52.21" cy="20.25" r="4.6" fill="#0F766E"/>
    <circle cx="55.5" cy="32" r="4.2" fill="#6B7280"/>
    <circle cx="52.21" cy="43.75" r="4.2" fill="#6B7280"/>
    <circle cx="43.75" cy="52.21" r="4.2" fill="#6B7280"/>
    <circle cx="32" cy="55.5" r="4.2" fill="#6B7280"/>
    <circle cx="20.25" cy="52.21" r="4.2" fill="#6B7280"/>
    <circle cx="11.79" cy="43.75" r="4.2" fill="#6B7280"/>
    <circle cx="8.5" cy="32" r="4.2" fill="#6B7280"/>
    <circle cx="11.79" cy="20.25" r="4.2" fill="#6B7280"/>
    <circle cx="20.25" cy="11.79" r="4.2" fill="#6B7280"/>
  </g>
  <!-- Negative-space fish swimming clockwise in the ring's center (MiroFish nod) -->
  <g opacity="0.55">
    <path d="M 22 34
             Q 27 27.5 34 28.6
             Q 39.5 29.5 42 32.6
             L 46.5 29.4
             Q 45.4 33 46.5 36.6
             L 42 33.9
             Q 38.6 37.6 32.5 37.4
             Q 26.5 37.2 22 34 Z"
          fill="#D4D2CB"/>
    <circle cx="35.6" cy="31.6" r="1.1" fill="#FAF9F6"/>
  </g>
</svg>
